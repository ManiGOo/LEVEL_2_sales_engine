services:
  # ===== Sales App (self-contained — no dependency on the scraper) =====
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      # Reach the Temporal server from inside the container. On the dev server
      # Temporal already runs on the host (localhost:7233); for bare-metal dev
      # the default `localhost:7233` from .env is used.
      - TEMPORAL_HOST=host.docker.internal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_started

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  # Dedicated Temporal worker that executes LeadResearchWorkflow entirely
  # inside the sales-app (writes results to the shared Pharma DB). It connects
  # to the Temporal server directly — no scraper involved.
  lead_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.lead_worker
    env_file: ./backend/.env
    environment:
      - TEMPORAL_HOST=host.docker.internal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      chromadb:
        condition: service_started

volumes:
  chromadata:
