services:
  # ===== Sales App =====
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8100:8000"
    env_file: ./backend/.env
    networks:
      - default
      - scrapper_default
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales_app
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8101:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

networks:
  scrapper_default:
    external: true

volumes:
  pgdata:
  chromadata:
